name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
        env:
          POSTGRES_DB: mem
          POSTGRES_USER: mem
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mem -d mem"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      MEM_DATABASE_URL: postgresql://mem:test@localhost:5432/mem
      MEM_EMBED_MODEL: fake
      MEM_EMBED_DIM: "64"
      MEM_STAND: "1"
      MEM_STATUS_SECRET: test-status
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.lock
      - run: pip install --require-hashes -r requirements-dev.lock
      - name: Test registry is up to date
        run: python tools/test_catalog.py --check
      - name: Comments and docstrings in English
        run: python tools/check_english.py
      - name: Documentation pairs and links
        run: python tools/check_docs.py
      - name: Tests with coverage
        run: |
          python -m coverage run --source=mem -m pytest -q -p no:cacheprovider tests
          echo "coverage of mem: $(python -m coverage report --format=total)%"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git . --no-banner --redact

  quickstart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Quick start from README on a clean runner
        run: tools/quickstart_check.sh
      - name: Logs
        if: failure()
        run: docker compose logs --no-color --tail=200
